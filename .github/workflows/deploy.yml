name: Deploy Takanesia Website

on:
  push:
    branches:
      - "**"

jobs:
  deploy:
    runs-on: self-hosted
    
    env:
      CONTAINER_NAME: takanesia-website
      IMAGE_NAME: takanesia-website
      PUBLIC_PORT: 3004
      CONTAINER_PORT: 8080
      TARGET_DIR: /opt/Takanesia-Website

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          path: deploy

      - name: Sync codebase to Production
        run: |
          cd "${{ env.TARGET_DIR }}" || exit 1
          git config --global --add safe.directory "${{ env.TARGET_DIR }}"
          git fetch origin
          git checkout ${{ github.ref_name }}
          git pull origin ${{ github.ref_name }}

      - name: Build Docker Image
        run: |
          docker buildx build \
            --no-cache \
            --tag ${{ env.IMAGE_NAME }}:latest \
            --tag ${{ env.IMAGE_NAME }}:${{ github.run_number }} \
            --load ./deploy

      - name: Remove Previous Image
        run: |
          # Calculate previous run number
          PREV_RUN=$(( ${{ github.run_number }} - 1 ))
          docker rmi ${{ env.IMAGE_NAME }}:$PREV_RUN || true

      - name: Deploy Container
        run: |
          # Ensure .env exists (we might need to pull it from a safe location or secrets)
          # For now, we assume it exists in the runner's persistent storage or is provided via secrets
          
          docker stop ${{ env.CONTAINER_NAME }} || true
          docker rm ${{ env.CONTAINER_NAME }} || true
          
          docker run -d \
            --name ${{ env.CONTAINER_NAME }} \
            --restart always \
            -p ${{ env.PUBLIC_PORT }}:${{ env.CONTAINER_PORT }} \
            ${{ env.IMAGE_NAME }}:${{ github.run_number }}

      - name: Post-Deployment Cleanup
        run: |
          docker image prune -f
          docker container prune -f
