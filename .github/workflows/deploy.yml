name: Deploy Takanesia Website

on:
  push:
    branches: [ "main", "master", "devel" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    
    env:
      CONTAINER_NAME: takanesia-website
      IMAGE_NAME: takanesia-website
      PUBLIC_PORT: 3004
      CONTAINER_PORT: 8080

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          path: deploy

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./deploy
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.run_number }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Remove Previous Image
        run: |
          # Calculate previous run number
          PREV_RUN=$(( ${{ github.run_number }} - 1 ))
          docker rmi ${{ env.IMAGE_NAME }}:$PREV_RUN || true

      - name: Deploy Container
        run: |
          # Ensure .env exists (we might need to pull it from a safe location or secrets)
          # For now, we assume it exists in the runner's persistent storage or is provided via secrets
          
          docker stop ${{ env.CONTAINER_NAME }} || true
          docker rm ${{ env.CONTAINER_NAME }} || true
          
          docker run -d \
            --name ${{ env.CONTAINER_NAME }} \
            --restart always \
            -p ${{ env.PUBLIC_PORT }}:${{ env.CONTAINER_PORT }} \
            ${{ env.IMAGE_NAME }}:${{ github.run_number }}

      - name: Post-Deployment Cleanup
        run: |
          docker image prune -f
          docker container prune -f
