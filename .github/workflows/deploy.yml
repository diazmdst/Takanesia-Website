name: Deploy Takanesia Website

on:
  push:
    branches:
      - "**"

jobs:
  deploy:
    runs-on: self-hosted

    env:
      CONTAINER_NAME: takanesia-website
      IMAGE_NAME: takanesia-website
      PUBLIC_PORT: 3004
      CONTAINER_PORT: 8080
      TARGET_DIR: /opt/Takanesia-Website

    steps:
      - name: Sync Codebase to Production
        run: |
          if [ ! -d "$TARGET_DIR/.git" ]; then
            git clone https://github.com/${{ github.repository }}.git $TARGET_DIR
          fi

          cd $TARGET_DIR

          git config --global --add safe.directory $TARGET_DIR

          git fetch origin
          git checkout ${{ github.ref_name }}
          git pull origin ${{ github.ref_name }}

      - name: Generate Image Tag
        id: version
        run: |
          LAST_TAG=$(docker images $IMAGE_NAME --format "{{.Tag}}" | grep -E '^[0-9]+$' | sort -n | tail -1)

          if [ -z "$LAST_TAG" ]; then
            NEXT_TAG=1
          else
            NEXT_TAG=$((LAST_TAG + 1))
          fi

          echo "NEXT_TAG=$NEXT_TAG" >> $GITHUB_ENV

      - name: Build Docker Image
        run: |
          docker build \
            -t $IMAGE_NAME:latest \
            -t $IMAGE_NAME:$NEXT_TAG \
            $TARGET_DIR

      - name: Run New Container
        run: |
          docker run -d \
            --name ${CONTAINER_NAME}-new \
            --restart unless-stopped \
            -p 127.0.0.1:3999:$CONTAINER_PORT \
            --env-file $TARGET_DIR/.env \
            $IMAGE_NAME:$NEXT_TAG

      - name: Wait Until Healthy
        run: |
          for i in {1..30}; do
            STATUS=$(docker inspect --format='{{json .State.Health.Status}}' ${CONTAINER_NAME}-new | tr -d '"')

            if [ "$STATUS" = "healthy" ]; then
              echo "Container healthy"
              exit 0
            fi

            echo "Waiting for healthcheck..."
            sleep 5
          done

          echo "Container failed healthcheck"
          docker logs ${CONTAINER_NAME}-new
          exit 1

      - name: Swap Containers
        run: |
          docker stop $CONTAINER_NAME || true
          docker rm $CONTAINER_NAME || true

          docker stop ${CONTAINER_NAME}-new

          docker run -d \
            --name $CONTAINER_NAME \
            --restart unless-stopped \
            -p $PUBLIC_PORT:$CONTAINER_PORT \
            --env-file $TARGET_DIR/.env \
            $IMAGE_NAME:$NEXT_TAG

          docker rm ${CONTAINER_NAME}-new || true

      - name: Remove Previous Image
        run: |
          PREVIOUS_TAG=$((NEXT_TAG - 1))
          docker rmi $IMAGE_NAME:$PREVIOUS_TAG || true